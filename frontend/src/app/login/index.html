<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Liên kết tới file CSS nằm cùng thư mục -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <!-- BẮT ĐẦU THẺ BODY -->
  <body>
    <form class="login_card">
      <h2>Đăng nhập</h2>

      <div class="input_group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nhap@gmail.com" required />
      </div>

      <div class="input_group">
        <label for="password">Mật khẩu</label>
        <input
          type="password"
          id="password"
          placeholder="Nhập mật khẩu"
          required
        />
      </div>

      <div class="remember_me">
        <input type="checkbox" id="remember" />
        <label for="remember">Ghi nhớ tôi</label>
      </div>

      <button type="submit" class="btn_submit">Đăng nhập</button>

      <div class="register_link">
        <!-- Đã sửa resgister.html -> register.html -->
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>
    </form>

    <!-- Nối file JavaScript xử lý đăng nhập -->
    <script src="login.js"></script>
  </body>
  <!-- KẾT THÚC THẺ BODY -->
</html>
