<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản</title>
    <!-- Dùng chung file style.css cũ -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form class="login_card">
      <h2>Tạo tài khoản</h2>

      <!-- Họ và tên -->
      <div class="input_group">
        <label for="fullname">Họ và tên</label>
        <input type="text" id="fullname" placeholder="Nguyễn Văn A" required />
      </div>

      <!-- Email -->
      <div class="input_group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nhap@gmail.com" required />
      </div>

      <!-- Mật khẩu -->
      <div class="input_group">
        <label for="password">Mật khẩu</label>
        <input
          type="password"
          id="password"
          placeholder="Tạo mật khẩu"
          required
        />
      </div>

      <!-- Nhập lại mật khẩu -->
      <div class="input_group">
        <label for="confirm_password">Xác nhận mật khẩu</label>
        <input
          type="password"
          id="confirm_password"
          placeholder="Nhập lại mật khẩu"
          required
        />
      </div>

      <!-- Nút Đăng ký -->
      <button type="submit" class="btn_submit">Đăng ký</button>

      <!-- Link quay lại Đăng nhập -->
      <div class="register_link">
        Đã có tài khoản? <a href="index.html">Đăng nhập ngay</a>
      </div>
    </form>
  </body>
</html>
